services:
  # Tier 1: Frontend (Nginx)
  frontend:
    image: nginx:alpine
    container_name: tier1-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend-net
    depends_on:
      - backend

  # Tier 2: Backend (Java-Login-App)
  backend:
    build:
      context: ./Java-Login-App
      dockerfile: Dockerfile
    container_name: tier2-backend
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/${MYSQL_DATABASE:-UserDB}?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER:-admin}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD:-Admin123}
    expose:
      - "8080"
    networks:
      - frontend-net
      - backend-net
    depends_on:
      db:
        condition: service_healthy

  # Tier 3: Database (MySQL)
  db:
    image: mysql:8.0
    container_name: tier3-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-UserDB}
      MYSQL_USER: ${MYSQL_USER:-admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Admin123}
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db-data:/var/lib/mysql
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-admin}", "-p${MYSQL_PASSWORD:-Admin123}"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

volumes:
  db-data:
